name = "lifesyncs"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# Cloudflare D1 Database Binding
# 1. Створіть базу даних: npx wrangler d1 create lifesync-db
# 2. Вставте отриманий database_id нижче:
[[d1_databases]]
binding = "DB"
database_name = "lifesync-db"
database_id = "b765f8b6-2189-40c2-88ac-7376682c6f3f"
